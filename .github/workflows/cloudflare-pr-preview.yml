name: Cloudflare PR Preview (Manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR Number to test"
        required: true
        type: string

jobs:
  build-and-preview:
    name: Build & Deploy Worker Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/internatlas
        run: npx prisma generate

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Vinext Worker
        working-directory: frontend
        run: npm run build:vinext

      - name: Configure Preview Worker Name
        working-directory: frontend
        run: |
          jq '.name = "intern-atlas-pr-${{ inputs.pr_number }}"' dist/server/wrangler.json > dist/server/wrangler.tmp.json
          mv dist/server/wrangler.tmp.json dist/server/wrangler.json

      - name: Deploy Preview
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:vinext