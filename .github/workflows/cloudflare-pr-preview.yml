name: Cloudflare PR Preview (Manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to test'
        required: true
        type: string

jobs:
  build-and-preview:
    name: Build & Deploy Worker Preview
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd frontend && npm install

      - name: Build and Deploy Vinext Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd frontend
          npm run build:vinext
          npx wrangler deploy --name intern-atlas-pr-${{ inputs.pr_number }} --config dist/server/wrangler.json